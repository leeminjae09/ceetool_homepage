# Managed by ceetool-payments. Included only in the CEETOOL static server block.
location = /api/payments/admin/homepage/media {
    access_log off;
    client_max_body_size 101m;
    client_body_timeout 120s;
    proxy_request_buffering off;
    proxy_pass http://127.0.0.1:3888;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    add_header X-Robots-Tag "noindex, nofollow" always;
}

location ^~ /api/payments/ {
    access_log off;
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:3888;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 40s;
    add_header X-Robots-Tag "noindex, nofollow" always;
}

location ^~ /pay/ {
    root /home/ubuntu/ceetool_homepage/dist;
    try_files /index.html =404;
    access_log off;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
}

location = /admin/payments {
    root /home/ubuntu/ceetool_homepage/dist;
    try_files /index.html =404;
    access_log off;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
}
