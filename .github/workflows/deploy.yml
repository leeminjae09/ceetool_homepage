name: CI/CD SSH Deploy

on:
  push:
    branches: ["main", "mysql-storage"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-test-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      MYSQL_TEST_HOST: 127.0.0.1
      MYSQL_TEST_USER: root
      MYSQL_TEST_PASSWORD: ci-test-only-password
    steps:
      - name: Check out deployment source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Install and verify payment server
        run: |
          npm ci --prefix server --ignore-scripts
          npm --prefix server run check
          npm --prefix server test

      - name: Build production files
        run: |
          npm run build
          printf '%s\n' "$GITHUB_SHA" > dist/deployment.txt

      - name: Package isolated payment runtime
        run: |
          mkdir -p "$RUNNER_TEMP/payments-release/runtime" "$RUNNER_TEMP/payments-release/server"
          cp "$(command -v node)" "$RUNNER_TEMP/payments-release/runtime/node"
          cp -a server/src server/deploy server/node_modules server/package.json server/package-lock.json server/.env.example "$RUNNER_TEMP/payments-release/server/"
          cp tables.sql "$RUNNER_TEMP/payments-release/"
          tar -czf payments-release.tar.gz -C "$RUNNER_TEMP/payments-release" .

      - name: Upload production files
        if: github.ref == 'refs/heads/main'
        uses: appleboy/scp-action@v1
        with:
          host: 43.202.220.56
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: dist,payments-release.tar.gz
          target: /home/ubuntu/ceetool_homepage
          overwrite: true

      - name: Set static file permissions
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 43.202.220.56
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -eu
            cd /home/ubuntu/ceetool_homepage
            test -s dist/index.html
            test "$(cat dist/deployment.txt)" = "${{ github.sha }}"
            sudo chmod o+rx /home/ubuntu /home/ubuntu/ceetool_homepage
            sudo chmod -R o+rX dist

      - name: Deploy payment server and scoped Nginx routes
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 43.202.220.56
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 8m
          script: |
            set -eu
            release=/home/ubuntu/ceetool-payments/releases/${{ github.sha }}
            mkdir -p "$release"
            tar -xzf /home/ubuntu/ceetool_homepage/payments-release.tar.gz -C "$release" --no-same-owner
            bash "$release/server/deploy/deploy.sh" "${{ github.sha }}"
            rm /home/ubuntu/ceetool_homepage/payments-release.tar.gz

      - name: Verify live deployment
        if: github.ref == 'refs/heads/main'
        env:
          SITE_URL: https://ceetool.com
        run: |
          curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 30 \
            -H 'Cache-Control: no-cache' \
            "$SITE_URL/deployment.txt?revision=$GITHUB_SHA" \
            -o "$RUNNER_TEMP/deployment.txt"
          diff -u dist/deployment.txt "$RUNNER_TEMP/deployment.txt"
          curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 30 \
            -H 'Cache-Control: no-cache' \
            "$SITE_URL/?revision=$GITHUB_SHA" \
            -o "$RUNNER_TEMP/production-index.html"
          diff -u dist/index.html "$RUNNER_TEMP/production-index.html"
          curl --fail --silent --show-error --retry 3 --max-time 10 \
            "$SITE_URL/api/payments/health" -o "$RUNNER_TEMP/payments-health.json"
          node -e 'const h = require(process.argv[1]); if (h.ok !== true) process.exit(1); console.log("Payment service configuration:", h);' "$RUNNER_TEMP/payments-health.json"
          curl --fail --silent --show-error --max-time 10 "$SITE_URL/admin" \
            -o "$RUNNER_TEMP/payments-page.html"
          diff -u dist/index.html "$RUNNER_TEMP/payments-page.html"
